[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --tb=short
    --strict-markers
    -ra
asyncio_mode = auto
markers =
    unit: Unit tests
    integration: Integration tests
    api: API endpoint tests
    worker: Worker functionality tests
    cli: CLI command tests